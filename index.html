<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شروع تازه</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;min-height:100vh;display:grid;place-items:center}
.card{width:min(92%,720px);padding:56px 28px;text-align:center;border:1px solid #ffffff22;border-radius:28px;background:#ffffff0d;backdrop-filter:blur(14px);box-shadow:0 20px 60px #0005}
h1{font-size:clamp(2.2rem,8vw,4.5rem);margin:0 0 16px}p{font-size:1.1rem;color:#cbd5e1;line-height:1.9}.btn{display:inline-block;margin-top:18px;padding:14px 24px;border-radius:14px;background:#fff;color:#0f172a;text-decoration:none;font-weight:800;cursor:pointer;border:0;font-size:1rem}
#msg{margin-top:18px;color:#a7f3d0;min-height:1.5em}
</style>
</head>
<body>
<main class="card">
<h1>سلام 👋</h1>
<p>این اولین نسخهٔ سایت توست؛ سبک، سریع و آمادهٔ توسعه.</p>
<button class="btn" onclick="document.getElementById('msg').textContent='سایت با موفقیت اجرا شد 🚀'">شروع</button>
<div id="msg"></div>
</main>
</body>
</html>
